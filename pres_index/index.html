<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark: #0A0A14;
      --bg-card: #12121E;
      --accent: #8B5CF6;
      --accent-light: #A78BFA;
      --accent-glow: rgba(139, 92, 246, 0.15);
      --text-primary: #E8E4F0;
      --text-secondary: #9B95A8;
      --text-muted: #5C5670;
      --border: #2A2A3A;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .container {
      max-width: 680px;
      width: 100%;
      padding: 60px 24px;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 3rem;
      margin-bottom: 12px;
    }

    h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 48px;
      letter-spacing: 0.05em;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-top: 32px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    a {
      display: block;
      padding: 20px 24px;
      border: 1px solid var(--border);
      color: var(--text-primary);
      text-decoration: none;
      margin-bottom: 8px;
      transition: all 0.3s ease;
      border-radius: 2px;
      position: relative;
    }

    a:hover {
      background: var(--bg-card);
      border-color: var(--accent);
    }

    .title {
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .tag {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-light);
      opacity: 0.6;
    }

    /* Lock screen */
    #lock { text-align: center; }

    #lock input {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 14px 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      width: 100%;
      max-width: 300px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.3s ease;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }

    #lock input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow);
    }

    #lock input::placeholder {
      color: var(--text-muted);
    }

    #lock button {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 14px 28px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      transition: all 0.3s ease;
      border-radius: 2px;
      font-family: 'Space Grotesk', sans-serif;
    }

    #lock button:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }

    .error {
      color: #F87171;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      letter-spacing: 0.02em;
    }

    #content { display: none; }

    .lock-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      border: 1px solid var(--border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="lock">
      <div class="lock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Locked</h1>
      <p class="subtitle">Enter password to view presentations.</p>
      <input type="password" id="pwd" placeholder="Password" autofocus>
      <button onclick="unlock()">Unlock</button>
      <p class="error" id="err">Incorrect password.</p>
    </div>
    <div id="content"></div>
  </div>

    function b64ToArr(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function unlock() {
      const pwd = document.getElementById('pwd').value;
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';

      try {
        const salt = b64ToArr(encrypted.salt);
        const iv = b64ToArr(encrypted.iv);
        const ct = b64ToArr(encrypted.ct);

        const keyMaterial = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ct
        );

        const html = new TextDecoder().decode(decrypted);
        document.getElementById('lock').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('content').innerHTML = html;
      } catch (e) {
        errEl.style.display = 'block';
      }
    }

    document.getElementById('pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });
  </script>

</html>
