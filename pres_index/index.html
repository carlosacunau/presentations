<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f4f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 640px; padding: 60px 24px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 48px; }
    a {
      display: block;
      padding: 20px 24px;
      border: 1px solid #2a2a2a;
      color: #f5f4f0;
      text-decoration: none;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    a:hover { background: #111; border-color: #7b8fa8; }
    .title { font-weight: 500; margin-bottom: 4px; }
    .desc { font-size: 0.85rem; color: #666; }
    /* Lock screen */
    #lock {
      text-align: center;
    }
    #lock input {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #f5f4f0;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      width: 100%;
      max-width: 300px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.3s ease;
    }
    #lock input:focus {
      border-color: #7b8fa8;
    }
    #lock button {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 12px 28px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      border: 1px solid #f5f4f0;
      background: transparent;
      color: #f5f4f0;
      transition: all 0.3s ease;
    }
    #lock button:hover {
      background: #f5f4f0;
      color: #0a0a0a;
    }
    .error { color: #c97b7b; font-size: 0.85rem; margin-top: 12px; display: none; }
    #content { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="lock">
      <h1>Locked</h1>
      <p class="subtitle">Enter password to view presentations.</p>
      <input type="password" id="pwd" placeholder="Password" autofocus>
      <button onclick="unlock()">Unlock</button>
      <p class="error" id="err">Incorrect password.</p>
    </div>
    <div id="content"></div>
  </div>

  <script>
    const encrypted = {
      salt: "15WHlb41r9Lc/HIiUoRO6Q==",
      iv: "EHOpg4LlZSpXlRyH",
      ct: "pKChRukEGfGyFXc+9ldUOLxkU992x34I8rFX4hPIoeQ2eQhfErnU2bB/hFYBxGS3inCFIfux7yXp9+dv5r5ELxzUi91mT3cM+Del64tK2V+0wAfiDjaEaUEVtfV/Mr/UzClsHnO4yi9eTxKw0sx4qA7tGAV0kgYzZVv7sKQqJ/fevs30xtBzbwEht18qSs2dl4RQeGVaiHR2ViuW3UOOwjRLeaU4PtWR6yQynrvy/dxcWzzFEXP4dyfW7NDMXRgA9fHa4BhrgzOXL1j/oVo8pXg5VNnskMw3hjpl9p70TQNL2WKae9FnWZQTIgbooloPft/cQXjvIMl+Dji5VcusJ7H/a+4rG5PUaHQCU3SpCMqmzbSOxpf+d2B2lTz29VU0IYDrXAoqzpygc51890e3g76vyzg1AQSGAQO3NWCPWQ3g/nsxyqblsYEsueL8K48f4DcbTSQhdqyoz1CH/h462B9egTWvejnNLhbQIZBFzGc9xk4pgiXolV+gwZ03ub2fDb/ItmJiODC1w5Utjc61jqY9VqZWKObcyude8bQPBcASMY8eK1P4WBkONC2fAlLQd7/YHxbmGJUWeI0iAsHT8SQ9yGpnl1kd7E80P9ZhithlqQcdFov6H5C1Q9HrnK2YoDIA57UwmAUI0OXOc5KBgCZUZ3VN7AlgyfgtqNYrDA87sRTcGGp7r0tOu1g96xeqMhu+sR9JMVTWg+6zfckVgd0jj9sp+mVWSLuRKhDzysQzo6NQBzC6RBEk15k8f48o9G+4n9mBqkEPcYAsXF3PFaAL1uehsvDag7a0DOb28Cm1orK9M0P51oepQVdn/n9/FZV+3MuU8WcJepgeLEQIjbtFzerFDFlEZ8hyuqcoQmOOVAS36+h5X4WEdr/C9uyymxvpUpXOLSpseB8Kq4m/B1vORhp8ZiIsYZvEF38q3II3ClR2f3QV1wK7Bn84wPAVfgcusFkInSsXoq1eUBMSTbGgO7voivragAt0qjik1YVQHJLxXG6ShOFgXA8dQMFUvc55v/6uQOpG63BNIKePKYZWwv9zGYKWmTcCs4s04wlzp/uKFWZnDoAYAeMgELfO7kNq9/EVtGnj3ySPWYM5EV1UFhh6M59Z2peIm4pTHILFNbl+F264EBXMFHWFul/QmZkMTGqnMjo2egnNzWL0y6DtIfhC8ZHyTZw22dP5XktE+Wnbtx2zY6UAvkOpsoDFwVllMs03rGvRV7m9rBIIGjb6LN+u7mjH/dQwJupOXlRwb/Tsb4YN0za+QShuy1JcCPfVWrGrHBUlaA=="
    };

    function b64ToArr(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function unlock() {
      const pwd = document.getElementById('pwd').value;
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';

      try {
        const salt = b64ToArr(encrypted.salt);
        const iv = b64ToArr(encrypted.iv);
        const ct = b64ToArr(encrypted.ct);

        const keyMaterial = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ct
        );

        const html = new TextDecoder().decode(decrypted);
        document.getElementById('lock').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('content').innerHTML = html;
      } catch (e) {
        errEl.style.display = 'block';
      }
    }

    document.getElementById('pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });
  </script>
</body>
</html>
