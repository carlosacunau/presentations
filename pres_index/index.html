<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f4f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 640px; padding: 60px 24px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 48px; }
    a {
      display: block;
      padding: 20px 24px;
      border: 1px solid #2a2a2a;
      color: #f5f4f0;
      text-decoration: none;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    a:hover { background: #111; border-color: #7b8fa8; }
    .title { font-weight: 500; margin-bottom: 4px; }
    .desc { font-size: 0.85rem; color: #666; }
    /* Lock screen */
    #lock {
      text-align: center;
    }
    #lock input {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #f5f4f0;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      width: 100%;
      max-width: 300px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.3s ease;
    }
    #lock input:focus {
      border-color: #7b8fa8;
    }
    #lock button {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 12px 28px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      border: 1px solid #f5f4f0;
      background: transparent;
      color: #f5f4f0;
      transition: all 0.3s ease;
    }
    #lock button:hover {
      background: #f5f4f0;
      color: #0a0a0a;
    }
    .error { color: #c97b7b; font-size: 0.85rem; margin-top: 12px; display: none; }
    #content { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="lock">
      <h1>Locked</h1>
      <p class="subtitle">Enter password to view presentations.</p>
      <input type="password" id="pwd" placeholder="Password" autofocus>
      <button onclick="unlock()">Unlock</button>
      <p class="error" id="err">Incorrect password.</p>
    </div>
    <div id="content"></div>
  </div>

  <script>
    const encrypted = {
      salt: "03fppmE+noyd+G6tAVPRbw==",
      iv: "VMgb2+OW+NjpArmx",
      ct: "w8Es26irnjl5e6DD8xbHPrX9UrKGwb2/gd+7I84ExMQKknBqdfxpPJNE+lKGcyl3fL3dXoOdc656NozHwjPX+5OlVFWvFsnlL5kwIZhYRAqmcbf5OqnvnSLQAJ/VYujGj/hbOBziLBQfOSEbq/6Ms7QSiK6aOENItCbGxLIUlXo45LsElurOLgNdvSuGOdjnlYFvgk/AJ+IfOqJyfJ+SvI+VPNtpRYkNhr7oJHMcdnWjOwoW+7KlEaeGuvTG2ifevUHbuUnQdI8Fquh+/D82jhPOiRHtI4sS4yvRHtm7e3TLr2BCwZV3VNTSXyY6QiTutAfcEcTdSNkPFl/TJxg9XH2Z5Qf+PpaASoAG+79RG+QY/zrRklWwcjtJXdgf/e06/wO3D8cl85ujenYPmJXsWSsVOILLSjalIqejb0SKQp8Eap1iTKQMJQ6l8ozS3eXcJvviJZ07Bu50V0UhiDoDFuw9bSVtNEujAYAJdiizli2hjI9OTgRVKzZNMgmeyoDfqkrZw+AgvhmBah1hg+4W8zmSzidg/8GJPS1xMyQHkgu0JxIOrumkueP+FcnE4I8hBFnjRg6SL1RtwTc9Rv8OW3EhjAWBlKcjqROg0xwQ8OqHVuud7VEKqlf1jLKTWFF1/xcmRtO9zJWWlo5qEGsz7r+9Yw7zce8cHwme7Me9eXgBKh7a7vxc9ENtKx3HgD6ISFzlQf0ikmvbgrFSprP5yvrZniQJWv7QWNAOVqMESV13OeGv+yHD+TaqPQyh/4SgvsHcnadAmQnVNH3nbhoik6hRBItoN+borxI7TgwPby/GVS/YMOognzZQUgD2xA+S+plIJC4MSm0qAT+hT3QBKKgAh2mFXZUtWe44IHT/I52kiiDJNxLsfsUCZIEMJZmYBEgZ4weSLmR81NwWavFZuy4DxquRIk0zc82LoQCOJdRkel5ZeWrrH2R6xzaR7fzxTllPQB+1Ou5kIVRc8Ies/F1DK9h9fxoWbQsQ65hcaFM+Kd7G3vD7fVfqFqkz+cWGpuRajYHcc9e1/1ojgtgBRjmYDJXOmZwAqE6WrRaUBL/GmJJ3HIMpOAb3YPdYd12Tfo0SdY+oEZ28+KSoABH0MAMqSIaycTfoB4hvTjaWPcpZTvjytSCu83IDPh574T+frIS03VFt78uuHn3N2PS5Cn8/xbZJNTViL5HKiiSyvprqclFY/W6PhKGRP8gSoXsCJc4+jQ0UA7NRQfBN14w6SGqRLl2+MQbowah9TskAsaYZ0b7UxPBcE/1UBcz/s5eM985X42yUhUPVVZwC/I+xhqyIKFp2f+3AI2U1Bjhm9K2BEKNpq7nS5MU5Y2Tk4/1vj2XE2OWmU/RDGEba6rAgO4odw4yIYw3C7/466eg="
    };

    function b64ToArr(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function unlock() {
      const pwd = document.getElementById('pwd').value;
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';

      try {
        const salt = b64ToArr(encrypted.salt);
        const iv = b64ToArr(encrypted.iv);
        const ct = b64ToArr(encrypted.ct);

        const keyMaterial = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ct
        );

        const html = new TextDecoder().decode(decrypted);
        document.getElementById('lock').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('content').innerHTML = html;
      } catch (e) {
        errEl.style.display = 'block';
      }
    }

    document.getElementById('pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });
  </script>
</body>
</html>
