<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026, Bracket Predictor</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3340;
    --text:#e6edf3; --muted:#8b97a7; --accent:#3fb950; --accent2:#2563eb;
    --pick:#1f6feb; --pickbg:#13283f; --gold:#f5c518;
    --card-w:182px; --col-gap:30px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0e1116,#0e1116ee);
    border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  .tz{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .tz b{color:var(--text)}
  button.reset{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer}
  button.reset:hover{border-color:var(--accent)}
  .champ-banner{background:var(--pickbg);border:1px solid var(--gold);color:var(--gold);
    padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;display:none}
  .champ-banner.show{display:inline-block}

  .wrap{overflow-x:scroll;overflow-y:auto;padding:24px 18px 60px;scrollbar-color:var(--line) var(--bg);scrollbar-width:auto}
  .wrap::-webkit-scrollbar{height:12px}
  .wrap::-webkit-scrollbar-track{background:var(--bg)}
  .wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}
  .wrap::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  .bracket{display:flex;align-items:stretch;gap:var(--col-gap);min-width:max-content;justify-content:center}
  .col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:var(--card-w)}
  .col-title{text-align:center;font-size:11px;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:700}
  .center-col{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:210px;gap:18px}

  .tie{display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;width:var(--card-w)}
  .tie .meta{font-size:10px;color:var(--muted);padding:3px 8px;display:flex;align-items:center;gap:6px;
    flex-wrap:nowrap;background:var(--panel2);border-bottom:1px solid var(--line);cursor:pointer;line-height:1.25}
  .tie .meta:hover{color:var(--text)}
  .tie .meta:hover .venue{color:var(--accent)}
  .tie .meta .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
  .third-card .meta{cursor:pointer}
  .third-card .meta:hover .venue{color:var(--accent)}
  .tie .meta .venue{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px;flex:0 0 auto;
    color:var(--accent2);font-weight:700;text-align:right}

  .venue-modal{position:fixed;inset:0;z-index:100;background:rgba(4,7,12,.72);
    display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
  .venue-modal.show{display:flex}
  .venue-pop{position:relative;background:var(--panel);border:1px solid var(--accent);
    border-radius:16px;padding:34px 40px;max-width:520px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .venue-pin{font-size:34px;margin-bottom:6px}
  .venue-big{font-size:30px;font-weight:800;line-height:1.2;color:#fff}
  .venue-sub{margin-top:12px;font-size:15px;color:var(--muted)}
  .venue-close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--muted);
    font-size:26px;line-height:1;cursor:pointer}
  .venue-close:hover{color:#fff}
  .slot{display:flex;align-items:center;gap:7px;padding:4px 9px;cursor:pointer;user-select:none;
    border-bottom:1px solid var(--line);transition:background .12s;min-height:26px}
  .slot:last-child{border-bottom:none}
  .slot:hover{background:var(--panel2)}
  .slot .flag{font-size:15px;width:19px;text-align:center;flex:0 0 auto}
  .slot .name{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.tbd .name{color:var(--muted);font-weight:500;font-style:italic}
  .slot.picked{background:var(--pickbg)}
  .slot.picked .name{color:#fff}
  .slot.picked::after{content:"\2713";color:var(--accent);font-weight:800;font-size:13px;margin-left:4px}
  .slot.loser{opacity:.4;text-decoration:line-through}
  /* locked official results */
  .slot.result-win{background:#13321a;cursor:default}
  .slot.result-win .name{color:#7ee787;font-weight:700}
  .slot.result-win::after{content:"\2713";color:var(--accent);font-weight:800;font-size:13px;margin-left:4px}
  .slot.result-lose{opacity:.35;text-decoration:line-through;cursor:default}
  .tie.is-locked{border-color:#2ea043}
  .final-badge{display:inline-block;background:#2ea043;color:#03210c;font-weight:800;
    font-size:8px;letter-spacing:.5px;padding:1px 4px;border-radius:4px;margin-left:4px;vertical-align:middle}

  .final-card{width:230px;border:2px solid var(--gold);border-radius:14px;background:var(--panel)}
  .final-card .meta{background:#241f08;border-bottom:1px solid var(--gold)}
  .final-label{text-align:center;color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.5px;
    text-transform:uppercase;padding:8px 0 2px}
  .champ-box{margin-top:10px;text-align:center;width:230px;background:var(--pickbg);
    border:1px solid var(--gold);border-radius:12px;padding:12px}
  .champ-box .lbl{font-size:10px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
  .champ-box .who{font-size:20px;font-weight:800;margin-top:4px}
  .champ-box .who.empty{color:var(--muted);font-size:14px;font-weight:500}

  .third-card{width:230px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:4px;overflow:hidden}
  .third-card .col-title{color:var(--muted);padding-top:8px}
  .third-card .meta{font-size:10px;color:var(--muted);padding:3px 8px;display:flex;align-items:center;gap:6px;
    flex-wrap:nowrap;background:var(--panel2);border-bottom:1px solid var(--line);line-height:1.25}
  .final-card .meta{flex-wrap:nowrap}

  @media (max-width:720px){
    :root{--card-w:150px;--col-gap:14px}
    header h1{font-size:15px}
    .wrap{padding:14px 10px 50px}
    .col{gap:10px}
    .slot{padding:3px 8px;min-height:24px}
    .slot .name{font-size:12px}
    .slot .flag{font-size:14px;width:18px}
    .tie .meta{font-size:9px;padding:3px 7px}
    .tie .meta .venue{max-width:52px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Mundial FIFA 2026, Bracket</h1>
    <div class="sub">Dieciseisavos hasta la Final. Haz clic en el equipo ganador para avanzar.</div>
  </div>
  <div class="spacer"></div>
  <div class="tz">Horas: <b>Chile</b> / <b>Colombia</b> <span style="opacity:.6">(Col = Chile menos 1h)</span></div>
  <div id="champBanner" class="champ-banner"></div>
  <button class="reset" id="resetBtn">Reiniciar</button>
</header>

<div class="wrap">
  <div class="bracket" id="bracket"></div>
</div>

<div id="venueModal" class="venue-modal">
  <div class="venue-pop">
    <button class="venue-close" onclick="closeVenue()" aria-label="Cerrar">×</button>
    <div class="venue-pin">📍</div>
    <div id="venueName" class="venue-big"></div>
    <div id="venueDate" class="venue-sub"></div>
  </div>
</div>

<script>
/* ---------- DATA ---------- */
/* Times are Chile (CLT). Colombia = CLT - 1h, computed automatically. */
const TEAMS = {
  RSA:{n:"Sudáfrica",f:"🇿🇦"}, CAN:{n:"Canadá",f:"🇨🇦"},
  GER:{n:"Alemania",f:"🇩🇪"}, PAR:{n:"Paraguay",f:"🇵🇾"},
  NED:{n:"Países Bajos",f:"🇳🇱"}, MAR:{n:"Marruecos",f:"🇲🇦"},
  BRA:{n:"Brasil",f:"🇧🇷"}, JPN:{n:"Japón",f:"🇯🇵"},
  FRA:{n:"Francia",f:"🇫🇷"}, SWE:{n:"Suecia",f:"🇸🇪"},
  CIV:{n:"Costa de Marfil",f:"🇨🇮"}, NOR:{n:"Noruega",f:"🇳🇴"},
  MEX:{n:"México",f:"🇲🇽"}, ECU:{n:"Ecuador",f:"🇪🇨"},
  ENG:{n:"Inglaterra",f:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"}, COD:{n:"RD Congo",f:"🇨🇩"},
  USA:{n:"Estados Unidos",f:"🇺🇸"}, BIH:{n:"Bosnia",f:"🇧🇦"},
  BEL:{n:"Bélgica",f:"🇧🇪"}, SEN:{n:"Senegal",f:"🇸🇳"},
  POR:{n:"Portugal",f:"🇵🇹"}, CRO:{n:"Croacia",f:"🇭🇷"},
  ESP:{n:"España",f:"🇪🇸"}, AUT:{n:"Austria",f:"🇦🇹"},
  SUI:{n:"Suiza",f:"🇨🇭"}, ALG:{n:"Argelia",f:"🇩🇿"},
  ARG:{n:"Argentina",f:"🇦🇷"}, CPV:{n:"Cabo Verde",f:"🇨🇻"},
  COL:{n:"Colombia",f:"🇨🇴"}, GHA:{n:"Ghana",f:"🇬🇭"},
  AUS:{n:"Australia",f:"🇦🇺"}, EGY:{n:"Egipto",f:"🇪🇬"}
};

const MATCHES = {
  // R32
  M73:{r:"R32", a:"RSA", b:"CAN", d:"28 Jun", t:"15:00", v:"Los Angeles"},
  M74:{r:"R32", a:"GER", b:"PAR", d:"29 Jun", t:"16:30", v:"Boston"},
  M75:{r:"R32", a:"NED", b:"MAR", d:"29 Jun", t:"21:00", v:"Monterrey"},
  M76:{r:"R32", a:"BRA", b:"JPN", d:"29 Jun", t:"13:00", v:"Houston"},
  M77:{r:"R32", a:"FRA", b:"SWE", d:"30 Jun", t:"17:00", v:"New York/New Jersey"},
  M78:{r:"R32", a:"CIV", b:"NOR", d:"30 Jun", t:"13:00", v:"Dallas"},
  M79:{r:"R32", a:"MEX", b:"ECU", d:"30 Jun", t:"21:00", v:"Mexico City"},
  M80:{r:"R32", a:"ENG", b:"COD", d:"01 Jul", t:"12:00", v:"Atlanta"},
  M81:{r:"R32", a:"USA", b:"BIH", d:"01 Jul", t:"20:00", v:"San Francisco Bay Area"},
  M82:{r:"R32", a:"BEL", b:"SEN", d:"01 Jul", t:"16:00", v:"Seattle"},
  M83:{r:"R32", a:"POR", b:"CRO", d:"02 Jul", t:"19:00", v:"Toronto"},
  M84:{r:"R32", a:"ESP", b:"AUT", d:"02 Jul", t:"15:00", v:"Los Angeles"},
  M85:{r:"R32", a:"SUI", b:"ALG", d:"02 Jul", t:"23:00", v:"BC Place Vancouver"},
  M86:{r:"R32", a:"ARG", b:"CPV", d:"03 Jul", t:"18:00", v:"Miami"},
  M87:{r:"R32", a:"COL", b:"GHA", d:"03 Jul", t:"21:30", v:"Kansas City"},
  M88:{r:"R32", a:"AUS", b:"EGY", d:"03 Jul", t:"14:00", v:"Dallas"},

  // R16
  M90:{r:"R16", a:{w:"M73"}, b:{w:"M75"}, d:"04 Jul", t:"13:00", v:"Houston"},
  M89:{r:"R16", a:{w:"M74"}, b:{w:"M77"}, d:"04 Jul", t:"17:00", v:"Philadelphia"},
  M91:{r:"R16", a:{w:"M76"}, b:{w:"M78"}, d:"05 Jul", t:"16:00", v:"New York/New Jersey"},
  M92:{r:"R16", a:{w:"M79"}, b:{w:"M80"}, d:"05 Jul", t:"20:00", v:"Mexico City"},
  M93:{r:"R16", a:{w:"M83"}, b:{w:"M84"}, d:"06 Jul", t:"15:00", v:"Dallas"},
  M94:{r:"R16", a:{w:"M81"}, b:{w:"M82"}, d:"06 Jul", t:"20:00", v:"Seattle"},
  M95:{r:"R16", a:{w:"M86"}, b:{w:"M88"}, d:"07 Jul", t:"12:00", v:"Atlanta"},
  M96:{r:"R16", a:{w:"M85"}, b:{w:"M87"}, d:"07 Jul", t:"16:00", v:"BC Place Vancouver"},

  // QF
  M97:{r:"QF", a:{w:"M89"}, b:{w:"M90"}, d:"09 Jul", t:"16:00", v:"Boston"},
  M98:{r:"QF", a:{w:"M93"}, b:{w:"M94"}, d:"10 Jul", t:"15:00", v:"Los Angeles"},
  M99:{r:"QF", a:{w:"M91"}, b:{w:"M92"}, d:"11 Jul", t:"17:00", v:"Miami"},
  M100:{r:"QF", a:{w:"M95"}, b:{w:"M96"}, d:"11 Jul", t:"21:00", v:"Kansas City"},

  // SF
  M101:{r:"SF", a:{w:"M97"}, b:{w:"M98"}, d:"14 Jul", t:"15:00", v:"Dallas"},
  M102:{r:"SF", a:{w:"M99"}, b:{w:"M100"}, d:"15 Jul", t:"15:00", v:"Atlanta"},

  // 3rd place
  M103:{r:"P3", a:{l:"M101"}, b:{l:"M102"}, d:"18 Jul", t:"17:00", v:"Miami"},

  // Final
  M104:{r:"F", a:{w:"M101"}, b:{w:"M102"}, d:"19 Jul", t:"15:00", v:"New York/New Jersey"}
};

/* Two-sided layout: left columns, center (Final), right columns mirrored */
/* Order is bracket-consistent: the two matches feeding the same next-round
   box sit vertically adjacent. Derived from the feeder tree. */
const LEFT = {
  R32:["M74","M77","M73","M75","M83","M84","M81","M82"],
  R16:["M89","M90","M93","M94"],
  QF :["M97","M98"],
  SF :["M101"]
};
const RIGHT = {
  R32:["M76","M78","M79","M80","M86","M88","M85","M87"],
  R16:["M91","M92","M95","M96"],
  QF :["M99","M100"],
  SF :["M102"]
};
const ROUND_TITLES = {R32:"Dieciseisavos", R16:"Octavos", QF:"Cuartos", SF:"Semifinal"};

/* ---------- OFFICIAL RESULTS (locked, final) ----------
   Add a line as each match finishes: matchId : winningTeamCodeOrSlot.
   Value is the WINNING team's 3-letter code (e.g. "BRA"), or "a"/"b" to
   pick by slot when the team came from a previous result.
   A locked match shows a "Final" badge, the loser greyed, and is NOT clickable.
   It overrides any local prediction for that match. */
const RESULTS = {
  M73: "CAN",   // 28 Jun: Canadá 1-0 Sudáfrica
  M74: "PAR",   // 29 Jun: Paraguay 1-1 Alemania (4-3 pen)
  M75: "MAR",   // 29 Jun: Marruecos 1-1 Países Bajos (3-2 pen)
  M76: "BRA",   // 29 Jun: Brasil 2-1 Japón
  M77: "FRA",   // 30 Jun: Francia 3-0 Suecia
  M78: "NOR",   // 30 Jun: Noruega 2-1 Costa de Marfil
  M79: "MEX",   // 30 Jun: México 2-0 Ecuador
  M80: "ENG",   // 01 Jul: Inglaterra 2-1 RD Congo
  M81: "USA",   // 01 Jul: Estados Unidos 2-0 Bosnia
  M82: "BEL",   // 01 Jul: Bélgica 3-2 Senegal (a.e.t.)
  M83: "POR",   // 02 Jul: Portugal 2-1 Croacia
  M84: "ESP",   // 02 Jul: España 3-0 Austria
  M85: "SUI",   // 02 Jul: Suiza 2-0 Argelia
  M86: "ARG",   // 03 Jul: Argentina 3-2 Cabo Verde (a.e.t.)
  M87: "COL",   // 03 Jul: Colombia 1-0 Ghana
  M88: "EGY",   // 03 Jul: Australia 1-1 Egipto (4-2 pen)
};

/* ---------- STATE ---------- */
const KEY = "wc2026_picks_v1";
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ picks = {}; }
function save(){ localStorage.setItem(KEY, JSON.stringify(picks)); }

/* picks[mid] = {s:"a"|"b", team:CODE}. Storing the team lets us invalidate
   a downstream pick when an upstream result changes the team in that slot. */
function pickSlot(mid){ const p=picks[mid]; return p?p.s:null; }
function isLocked(mid){ return mid in RESULTS; }
/* Resolve a locked result to a team code. RESULTS value may be a team code or a slot. */
function lockedWinner(mid){
  if(!(mid in RESULTS)) return null;
  const v = RESULTS[mid]; const m = MATCHES[mid];
  if(v==="a") return resolveSource(m.a);
  if(v==="b") return resolveSource(m.b);
  return v; // explicit team code
}
function lockedLoser(mid){
  if(!(mid in RESULTS)) return null;
  const w = lockedWinner(mid); const m = MATCHES[mid];
  const a = resolveSource(m.a), b = resolveSource(m.b);
  return w===a ? b : a;
}
function resolveSource(src){
  if(typeof src === "string") return src;
  if(src.w){ return winnerOf(src.w); }
  if(src.l){ return loserOf(src.l); }
  return null;
}
function winnerOf(mid){
  if(isLocked(mid)) return lockedWinner(mid);   // official result wins
  const p = picks[mid]; if(!p) return null;
  const m = MATCHES[mid];
  return resolveSource(p.s==="a"?m.a:m.b);
}
function loserOf(mid){
  if(isLocked(mid)) return lockedLoser(mid);
  const p = picks[mid]; if(!p) return null;
  const m = MATCHES[mid];
  return resolveSource(p.s==="a"?m.b:m.a);
}

function pick(mid, slot){
  if(isLocked(mid)) return; // result is final, no picking
  const m=MATCHES[mid];
  const team = resolveSource(slot==="a"?m.a:m.b);
  if(!team) return; // slot not resolved yet, nothing to pick
  if(picks[mid] && picks[mid].s===slot){ delete picks[mid]; } // toggle off
  else { picks[mid]={s:slot, team:team}; }
  cascadeClear();
  save(); render();
}
/* Delete any pick whose stored team no longer occupies the chosen slot
   (i.e. an upstream result changed). Repeat until stable. */
function cascadeClear(){
  let changed=true;
  while(changed){
    changed=false;
    for(const mid in picks){
      const m=MATCHES[mid]; const p=picks[mid];
      const current = resolveSource(p.s==="a"?m.a:m.b);
      if(current!==p.team){ delete picks[mid]; changed=true; }
    }
  }
}

/* ---------- RENDER ---------- */
function colTime(t){
  const [h,mn]=t.split(":").map(Number);
  let ch=(h-1+24)%24;
  return String(ch).padStart(2,"0")+":"+mn.toString().padStart(2,"0");
}
function slotHTML(mid, slot){
  const m=MATCHES[mid];
  const code = resolveSource(slot==="a"?m.a:m.b);
  const locked = isLocked(mid);
  const isPicked = pickSlot(mid)===slot;
  const otherPicked = pickSlot(mid) && pickSlot(mid)!==slot;
  let flag="🛡️", name;
  if(code){ flag=TEAMS[code].f; name=TEAMS[code].n; }
  else {
    const src = slot==="a"?m.a:m.b;
    if(typeof src==="string"){ name=src; }
    else if(src.w){ name="Ganador "+src.w; }
    else if(src.l){ name="Perdedor "+src.l; }
  }
  const cls=["slot"];
  if(!code) cls.push("tbd");
  if(locked){
    const w = lockedWinner(mid);
    if(code===w) cls.push("result-win"); else cls.push("result-lose");
  } else {
    if(isPicked) cls.push("picked");
    if(otherPicked) cls.push("loser");
  }
  const clickable = (code && !locked) ? `onclick="pick('${mid}','${slot}')"` : "";
  return `<div class="${cls.join(' ')}" ${clickable}>
    <span class="flag">${flag}</span><span class="name">${name}</span></div>`;
}
function venueShort(v){
  if(!v) return "Sede";
  // City-only short label for the compact header tag.
  const map={
    "Los Angeles":"LA","New York/New Jersey":"NY/NJ","San Francisco Bay Area":"SF Bay",
    "BC Place Vancouver":"Vancouver","Mexico City":"CDMX","Kansas City":"KC"
  };
  return map[v] || v;
}
function tieHTML(mid, finalStyle){
  const m=MATCHES[mid];
  const venue = m.v ? venueShort(m.v) : "Sede";
  const lockCls = isLocked(mid) ? " is-locked" : "";
  const cls = (finalStyle ? "tie final-card" : "tie") + lockCls;
  const badge = isLocked(mid) ? `<span class="final-badge">FINAL</span>` : "";
  return `<div class="${cls}" data-mid="${mid}">
    <div class="meta" onclick="showVenue('${mid}')" title="Ver sede e info">
      <span class="dt">${m.d} · ${m.t} 🇨🇱 / ${colTime(m.t)} 🇨🇴 ${badge}</span>
      <span class="venue">${venue}</span>
    </div>
    ${slotHTML(mid,"a")}
    ${slotHTML(mid,"b")}
  </div>`;
}
function colHTML(title, ids, finalStyle){
  return `<div class="col"><div class="col-title">${title}</div>${ids.map(id=>tieHTML(id,finalStyle)).join("")}</div>`;
}

function render(){
  const champBanner=document.getElementById("champBanner");
  const champ=winnerOf("M104");
  if(champ){ champBanner.textContent="Campeón: "+TEAMS[champ].f+" "+TEAMS[champ].n; champBanner.classList.add("show"); }
  else champBanner.classList.remove("show");

  const m103=MATCHES.M103;
  const center = `
    <div class="center-col">
      <div class="final-label">Final</div>
      ${tieHTML("M104", true)}
      <div class="champ-box">
        <div class="lbl">Campeón del Mundo</div>
        <div class="who ${champ?'':'empty'}">${champ?TEAMS[champ].f+" "+TEAMS[champ].n:"por definir"}</div>
      </div>
      <div class="third-card">
        <div class="col-title">Tercer Puesto</div>
        <div class="meta" onclick="showVenue('M103')" title="Ver sede e info"><span class="dt">${m103.d} · ${m103.t} 🇨🇱 / ${colTime(m103.t)} 🇨🇴</span><span class="venue">${venueShort(m103.v)}</span></div>
        ${slotHTML("M103","a")}${slotHTML("M103","b")}
      </div>
    </div>`;

  document.getElementById("bracket").innerHTML =
    colHTML(ROUND_TITLES.R32, LEFT.R32) +
    colHTML(ROUND_TITLES.R16, LEFT.R16) +
    colHTML(ROUND_TITLES.QF,  LEFT.QF) +
    colHTML(ROUND_TITLES.SF,  LEFT.SF) +
    center +
    colHTML(ROUND_TITLES.SF,  RIGHT.SF) +
    colHTML(ROUND_TITLES.QF,  RIGHT.QF) +
    colHTML(ROUND_TITLES.R16, RIGHT.R16) +
    colHTML(ROUND_TITLES.R32, RIGHT.R32);
}

function showVenue(mid){
  const m=MATCHES[mid];
  const venue = m.v ? m.v : "Sede por definir";
  document.getElementById("venueName").textContent = venue;
  document.getElementById("venueDate").textContent =
    m.d + " · " + m.t + " (Chile) / " + colTime(m.t) + " (Colombia)";
  document.getElementById("venueModal").classList.add("show");
}
function closeVenue(){ document.getElementById("venueModal").classList.remove("show"); }
document.getElementById("venueModal").addEventListener("click", function(e){
  if(e.target.id==="venueModal") closeVenue();
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeVenue(); });

document.getElementById("resetBtn").onclick=function(){
  if(confirm("¿Borrar todas tus predicciones?")){ picks={}; save(); render(); }
};
render();
</script>
</body>
</html>
