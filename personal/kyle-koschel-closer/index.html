<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carlos Acuna · Spanish-speaking closer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237C3AED'/></svg>">
  <style>
    html, body { margin: 0; padding: 0; background: #FAF9FC; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
      background-size: 60px 60px; }
    .fallback-message { width: min(640px, 88vw); margin: 80px auto; }
    .impress-supported .fallback-message { display: none; }
    .step { width: 1280px; height: 800px; opacity: 0.25; transition: opacity 0.6s ease; }
    .step img { width: 1280px; height: 800px; display: block; border: 1px solid #E3DFEA; border-radius: 6px;
      box-shadow: 0 30px 80px rgba(60, 30, 120, 0.15); }
    .step.active { opacity: 1; }
    body.impress-on-overview .step { opacity: 1; }
    #overview { width: 10px; height: 10px; }
    .hint { position: fixed; bottom: 14px; right: 18px; z-index: 5; font-size: 12px; color: #6E6880; letter-spacing: 0.05em; }
    .hint kbd { border: 1px solid #C4B5FD; border-radius: 3px; padding: 1px 6px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="fallback-message"><p>Use a recent version of Chrome, Safari, or Firefox to view this presentation.</p></div>
  <div id="impress" data-transition-duration="1000" data-width="1440" data-height="820" data-min-scale="0.1">
    <div id="s0" class="step" data-x="0" data-y="0" data-rotate="0" data-scale="1.6"><img src="assets/slides/slide-0.png" alt="Slide 1"></div>
    <div id="s1" class="step" data-x="2100" data-y="-300" data-rotate="-6" data-scale="1"><img src="assets/slides/slide-1.png" alt="Slide 2"></div>
    <div id="s2" class="step" data-x="3700" data-y="900" data-rotate="5" data-scale="1"><img src="assets/slides/slide-2.png" alt="Slide 3"></div>
    <div id="s3" class="step" data-x="1900" data-y="1500" data-rotate="-3" data-scale="1"><img src="assets/slides/slide-3.png" alt="Slide 4"></div>
    <div id="s4" class="step" data-x="3900" data-y="2500" data-rotate="7" data-scale="1"><img src="assets/slides/slide-4.png" alt="Slide 5"></div>
    <div id="s5" class="step" data-x="5500" data-y="1500" data-rotate="-5" data-scale="1"><img src="assets/slides/slide-5.png" alt="Slide 6"></div>
    <div id="s6" class="step" data-x="6100" data-y="3000" data-rotate="4" data-scale="1"><img src="assets/slides/slide-6.png" alt="Slide 7"></div>
    <div id="s7" class="step" data-x="4600" data-y="4100" data-rotate="-2" data-scale="1.2"><img src="assets/slides/slide-7.png" alt="Slide 8"></div>
    <div id="overview" class="step" data-x="2860" data-y="1980" data-scale="6.6"></div>
  </div>
  <div class="hint"><kbd>&rarr;</kbd> next &nbsp; <kbd>&larr;</kbd> back &nbsp; <kbd>O</kbd> overview</div>
  <script src="impress.js"></script>
  <script>
    var api = impress();
    api.init();
    document.addEventListener("keydown", function (e) {
      if (e.key === "o" || e.key === "O") { e.preventDefault(); api.goto(document.getElementById("overview")); }
    });
    var wheelLocked = false;
    document.addEventListener("wheel", function (e) {
      e.preventDefault();
      if (wheelLocked || Math.abs(e.deltaY) < 8) return;
      wheelLocked = true;
      if (e.deltaY > 0) api.next(); else api.prev();
      setTimeout(function () { wheelLocked = false; }, 1000);
    }, { passive: false });
  </script>
</body>
</html>
