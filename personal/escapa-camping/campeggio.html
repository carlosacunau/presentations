    tbody tr:hover { background: #e3f2fd; }
    tbody td { padding: 10px 16px; vertical-align: top; font-size: 0.9rem; }
    .parent-name { font-weight: 600; }
    .size-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; background: #e3f2fd; color: #1565c0; font-weight: 500; }
    .kid-entry { margin-bottom: 4px; }
    .kid-name { font-weight: 500; }
    tfoot td { padding: 12px 16px; font-weight: 700; background: #263238; color: #fff; font-size: 0.9rem; }
    .no-results { text-align: center; padding: 40px; color: #999; }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .header h1 { font-size: 1.4rem; }
      .controls { flex-direction: column; align-items: flex-start; }

let sortBy = 'nombre';
let sortDir = 1;

function getFirstName(p) { return p.split(' ')[0].toLowerCase(); }
function getLastName(p) { const parts = p.split(' '); return parts[parts.length - 1].toLowerCase(); }

function setSort(type) {
  if (sortBy === type) { sortDir *= -1; }
  else { sortBy = type; sortDir = 1; }
  document.querySelectorAll('.btn[data-sort]').forEach(b => b.classList.toggle('active', b.dataset.sort === type));
  render();
}

function render() {
  const sortFn = sortBy === 'apellido' ? getLastName : getFirstName;
  const sorted = [...DATA].sort((a, b) => {
    const va = sortFn(a.p), vb = sortFn(b.p);
    return va.localeCompare(vb, 'es', {sensitivity: 'base'}) * sortDir;
  });

  const body = document.getElementById('camping-body');
  let html = '';
  let kidCount = 0;

  sorted.forEach(d => {
    const kids = d.c.map(k => '<div class="kid-entry"><span class="kid-name">' + k.n + '</span> <span class="size-tag">' + k.s + '</span></div>').join('');
    kidCount += d.c.length;
    html += '<tr>' +
      '<td><span class="parent-name">' + d.p + '</span> <span class="size-tag">' + d.ps + '</span></td>' +
      '<td>' + kids + '</td>' +
      '</tr>';
  });

  body.innerHTML = html;
  document.getElementById('count-total').textContent = kidCount + ' niños / ' + sorted.length + ' apoderados';
  document.getElementById('count-display').textContent = sorted.length + ' apoderados';
}

render();
