const LAST_UPDATED = '18/04 06:47';
let sortBy = 'nombre';
let sortDir = 1;

function getFirstName(p) { return p.split(' ')[0].toLowerCase(); }
function getLastName(p) { const parts = p.split(' '); return parts[parts.length - 1].toLowerCase(); }

function setSort(type) {
  if (sortBy === type) { sortDir *= -1; }
  else { sortBy = type; sortDir = 1; }
  document.querySelectorAll('.btn[data-sort]').forEach(b => b.classList.toggle('active', b.dataset.sort === type));
  render();
}

function render() {
  function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  const searchTerm = norm(document.getElementById('search-box').value.trim());
  const sortFn = sortBy === 'apellido' ? getLastName : getFirstName;
  const filtered = searchTerm ? DATA.filter(d => norm(d.p).includes(searchTerm)) : DATA;
  const sorted = [...filtered].sort((a, b) => {
    const va = sortFn(a.p), vb = sortFn(b.p);
    return va.localeCompare(vb, 'es', {sensitivity: 'base'}) * sortDir;
  });

  const body = document.getElementById('camping-body');
  let html = '';
  let kidCount = 0;

  sorted.forEach(d => {
    const kids = d.c.map(k => '<div class="kid-entry"><span class="kid-name">' + k.n + '</span> <span class="size-tag">' + k.s + '</span></div>').join('');
    kidCount += d.c.length;
    html += '<tr>' +
      '<td><span class="parent-name">' + d.p + '</span> <span class="size-tag">' + d.ps + '</span></td>' +
      '<td>' + kids + '</td>' +
      '</tr>';
  });

  body.innerHTML = html;
  document.getElementById('count-total').textContent = kidCount + ' niños / ' + sorted.length + ' apoderados';
  const totalCampistas = sorted.length + kidCount;
  document.getElementById('count-display').textContent = sorted.length + ' de ' + DATA.length + ' apoderados (' + totalCampistas + ' campistas en total) · Actualizado: ' + LAST_UPDATED;
}
