const LAST_UPDATED = '01/04 17:01';
let sortBy = 'nombre';
let sortDir = 1; // 1=asc, -1=desc
let expandedIdx = null;
let colOrder = 'grado';

function getFirstName(p) { return p.split(' ')[0].toLowerCase(); }
function getLastName(p) { const parts = p.split(' '); return parts[parts.length - 1].toLowerCase(); }

function setSort(type) {
  if (sortBy === type) { sortDir *= -1; }
  else { sortBy = type; sortDir = 1; }
  document.querySelectorAll('.btn[data-sort]').forEach(b => b.classList.toggle('active', b.dataset.sort === type));
  document.getElementById('sort-arrow').textContent = sortDir === 1 ? '▲' : '▼';
  expandedIdx = null;
  render();
}

function toggleSortDir() {
  sortDir *= -1;
  document.getElementById('sort-arrow').textContent = sortDir === 1 ? '▲' : '▼';
  expandedIdx = null;
  render();
}

function setColOrder(order) {
  colOrder = order;
  document.querySelectorAll('.btn[data-col]').forEach(b => b.classList.toggle('active', b.dataset.col === order));
  expandedIdx = null;
  updateHeaders();
  render();
}

// Column configs: grado order vs fecha order
const COLS_GRADO = [
  {key: 'e', name: 'Esploratori', meta: '1° Básico · 20-22 Nov', cls: 'col-esploratori', img: 'img/esploratori.png'},
  {key: 'c', name: 'Campeggio', meta: '2° Básico · 06-08 Nov', cls: 'col-campeggio', img: 'img/campeggio.png'},
  {key: 'k', name: 'Campisti', meta: '4° Básico · 13-15 Nov', cls: 'col-campisti', img: 'img/campisti.png'},
  {key: 'm', name: 'Papimono', meta: '6° Básico · 27-29 Nov', cls: 'col-papimono', img: 'img/papimono.png'}
];
const COLS_FECHA = [
  {key: 'c', name: 'Campeggio', meta: '2° Básico · 06-08 Nov', cls: 'col-campeggio', img: 'img/campeggio.png'},
  {key: 'k', name: 'Campisti', meta: '4° Básico · 13-15 Nov', cls: 'col-campisti', img: 'img/campisti.png'},
  {key: 'e', name: 'Esploratori', meta: '1° Básico · 20-22 Nov', cls: 'col-esploratori', img: 'img/esploratori.png'},
  {key: 'm', name: 'Papimono', meta: '6° Básico · 27-29 Nov', cls: 'col-papimono', img: 'img/papimono.png'}
];

function getCols() { return colOrder === 'fecha' ? COLS_FECHA : COLS_GRADO; }

function updateHeaders() {
  const cols = getCols();
  const headerRow = document.querySelector('thead tr');
  // Remove all th except the first (Apoderado)
  while (headerRow.children.length > 1) headerRow.removeChild(headerRow.lastChild);
  cols.forEach(col => {
    const th = document.createElement('th');
    th.className = col.cls;
    th.innerHTML = '<img class="camp-logo" src="' + col.img + '" alt=""><br><span class="camp-name">' + col.name + '</span><span class="camp-meta">' + col.meta + '</span>';
    headerRow.appendChild(th);
  });
  // Update footer order
  const footerRows = document.querySelectorAll('tfoot tr');
  footerRows.forEach(row => {
    while (row.children.length > 1) row.removeChild(row.lastChild);
  });
  cols.forEach(col => {
    const td1 = document.createElement('td');
    td1.id = 'count-' + col.key;
    td1.textContent = '0';
    footerRows[0].appendChild(td1);
    const td2 = document.createElement('td');
    td2.id = 'total-' + col.key;
    td2.textContent = '0';
    footerRows[1].appendChild(td2);
  });
}

function getAllSizes() {
  const sizes = new Set();
  DATA.forEach(d => {
    if (d.ps && d.ps !== '—') sizes.add(d.ps);
    [d.e, d.c, d.k, d.m].forEach(arr => arr.forEach(kid => { if (kid.s && kid.s !== '—') sizes.add(kid.s); }));
  });
  const letter = ['XS','S','M','L','XL','XXL'];
  const numeric = [];
  const other = [];
  sizes.forEach(s => { if (letter.includes(s)) return; if (s.match(/^[0-9]/)) numeric.push(s); else other.push(s); });
  numeric.sort((a,b) => parseInt(a) - parseInt(b));
  return [...letter.filter(s => sizes.has(s)), ...numeric, ...other];
}

function hasSize(d, size) {
  if (d.ps === size) return true;
  return [d.e, d.c, d.k, d.m].some(arr => arr.some(kid => kid.s === size));
}

function hasCamp(d, camp) {
  const map = {esploratori: 'e', campeggio: 'c', campisti: 'k', papimono: 'm'};
  const key = map[camp];
  return key ? d[key].length > 0 : false;
}

function kidsHtml(arr) {
  if (!arr.length) return '<td class="empty-cell">—</td>';
  return '<td>' + arr.map(k => '<div class="kid-entry"><span class="kid-name">' + k.n + '</span><span class="kid-size">Talla: ' + k.s + '</span></div>').join('') + '</td>';
}

function expBadges(ex) {
  return ex.split(',').map(e => {
    e = e.trim();
    let cls = 'exp-primera';
    if (e.includes('Esploratori')) cls = 'exp-esploratori';
    else if (e.includes('Campeggio')) cls = 'exp-campeggio';
    else if (e.includes('Campisti')) cls = 'exp-campisti';
    else if (e.includes('Papimono')) cls = 'exp-papimono';
    return '<span class="experience-badge ' + cls + '">' + e + '</span>';
  }).join('');
}

function starsHtml(rt) {
  if (!rt || rt === '—') return '<span style="color:#999">Sin calificación</span>';
  const n = parseInt(rt);
  return '<span class="stars">' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</span>';
}

function detailHtml(d, rowIdx) {
  const phone = d.ph.replace(/[^+0-9]/g, '');
  const bg = rowIdx % 2 === 0 ? '#eef1f5' : '#f5f5f0'; return '<tr class="detail-row"><td colspan="5" style="background:' + bg + '"><div class="detail-content">' +
    '<div class="detail-item"><span class="detail-label">Teléfono</span><span class="detail-value"><a href="tel:' + phone + '">' + d.ph + '</a></span></div>' +
    '<div class="detail-item"><span class="detail-label">Experiencia</span><span class="detail-value">' + expBadges(d.ex) + '</span></div>' +
    '<div class="detail-item"><span class="detail-label">Calificación Catemu 2025</span><span class="detail-value">' + starsHtml(d.rt) + '</span></div>' +
    '<div class="detail-comment"><span class="detail-label">Comentario</span><br>' + d.cm + '</div>' +
    '</div></td></tr>';
}

function render() {
  const campFilter = document.getElementById('filter-camp').value;
  const sizeFilter = document.getElementById('filter-size').value;

  function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  const searchTerm = norm(document.getElementById('search-box').value.trim());
  let filtered = DATA.filter(d => {
    if (searchTerm && !norm(d.p).includes(searchTerm)) return false;
    if (campFilter !== 'todos' && !hasCamp(d, campFilter)) return false;
    if (sizeFilter !== 'todas' && !hasSize(d, sizeFilter)) return false;
    return true;
  });

  const sortFn = sortBy === 'apellido' ? getLastName : getFirstName;
  filtered.sort((a, b) => {
    const va = sortFn(a.p), vb = sortFn(b.p);
    return va.localeCompare(vb, 'es', {sensitivity: 'base'}) * sortDir;
  });

  const body = document.getElementById('camping-body');
  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="5" class="no-results">No hay resultados para estos filtros</td></tr>';
    ['e','c','k','m'].forEach(c => { var el; el = document.getElementById('count-' + c); if (el) el.textContent = '0'; el = document.getElementById('total-' + c); if (el) el.textContent = '0'; });
    document.getElementById('count-display').textContent = '0 de ' + DATA.length + ' apoderados (0 campistas en total)';
    return;
  }

  const counts = {e: 0, c: 0, k: 0, m: 0};
  const parents = {e: 0, c: 0, k: 0, m: 0};
  let html = '';
  filtered.forEach((d, i) => {
    counts.e += d.e.length;
    counts.c += d.c.length;
    counts.k += d.k.length;
    counts.m += d.m.length;
    if (d.e.length) parents.e++;
    if (d.c.length) parents.c++;
    if (d.k.length) parents.k++;
    if (d.m.length) parents.m++;

    const cols = getCols();
    html += '<tr onclick="toggleDetail(' + i + ')">' +
      '<td class="parent-cell"><span class="parent-name">' + d.p + '</span><span class="parent-size">Talla: ' + d.ps + '</span></td>' +
      cols.map(col => kidsHtml(d[col.key])).join('') +
      '</tr>';
    if (expandedIdx === i) html += detailHtml(d, i);
  });

  body.innerHTML = html;
  Object.keys(counts).forEach(c => { const el = document.getElementById('count-' + c); if (el) el.textContent = counts[c]; });
  Object.keys(counts).forEach(c => { const el = document.getElementById('total-' + c); if (el) el.textContent = counts[c] + parents[c]; });
  const totalKids = counts.e + counts.c + counts.k + counts.m;
  const totalCampistas = filtered.length + totalKids;
  document.getElementById('count-display').textContent = filtered.length + ' de ' + DATA.length + ' apoderados (' + totalCampistas + ' campistas en total) · Actualizado: ' + LAST_UPDATED;
}

function toggleDetail(idx) {
  expandedIdx = expandedIdx === idx ? null : idx;
  render();
}

// Populate size filter
const sizeSelect = document.getElementById('filter-size');
getAllSizes().forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  sizeSelect.appendChild(opt);
});

updateHeaders();
render();
