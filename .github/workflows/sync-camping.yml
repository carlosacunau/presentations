name: Sync Camping Matrix

on:
  schedule:
    - cron: '3 */2 * * *'  # Every 2 hours at :03
  workflow_dispatch: {}      # Manual trigger button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Write service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > /tmp/sa-key.json

      - name: Sync from Google Sheets
        run: python personal/escapa-camping/sync.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
          SPREADSHEET_ID: 1NutvWUnFoWsD0atbk9XYp02AIlxfotYGqMcweyqndSQ

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add personal/escapa-camping/matrix.html personal/escapa-camping/campeggio.html
          git commit -m "chore: auto-sync camping matrix from Google Forms"
          git pull --rebase
          git push
